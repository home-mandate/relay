name: Scheduled

# Checks that do not depend on a change: vulnerabilities in dependencies become known
# without a commit (every night), and long fuzzing finds what the short runs in CI do not
# (on the 1st and 15th of every month, one job per target so each gets the full time).
# A failure opens an issue, or comments on the open one; main itself is never changed.
on:
  schedule:
    - cron: "53 2 * * *" # security, every night
    - cron: "7 4 1,15 * *" # fuzzing, twice a month
  workflow_dispatch:
    inputs:
      what:
        description: "security or fuzz"
        required: true
        default: security
        type: choice
        options: [security, fuzz]

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  security:
    name: Security (govulncheck)
    if: github.event.schedule == '53 2 * * *' || inputs.what == 'security'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vulncheck

  fuzz-targets:
    name: Fuzz targets
    if: github.event.schedule == '7 4 1,15 * *' || inputs.what == 'fuzz'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "targets=$(make -s fuzz-targets)" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz (long, ${{ matrix.target }})
    needs: [fuzz-targets]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZ_TARGETS=${{ matrix.target }} FUZZTIME=45m
      # A failing input is written to testdata/fuzz; keep it to reproduce the failure.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ matrix.target }}
          path: tunnel/testdata/fuzz
          if-no-files-found: ignore

  report:
    name: Report a failure
    needs: [security, fuzz-targets, fuzz]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Scheduled check failed: ${{ github.event.schedule == '53 2 * * *' && 'security' || 'fuzzing' }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN"
          else
            gh issue create --title "$TITLE" --body "The scheduled run failed: $RUN"
          fi
